<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>エージェント稼働状況</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root { --bg:#f3f6fa; --card:#fff; --text:#17253a; --muted:#56657a; --line:#dce3ec;
      --green:#16834c; --blue:#2563eb; --yellow:#a96900; --red:#d12d3e; --gray:#7b8797; }
    @media(prefers-color-scheme:dark) {
      :root { --bg:#101722; --card:#1a2433; --text:#edf2fa; --muted:#b1bfd2; --line:#354258;
        --green:#4cce8a; --blue:#70a9ff; --yellow:#f7c24e; --red:#ff7c88; --gray:#97a2b3; }
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 system-ui,sans-serif; }
    main { max-width:1000px; margin:auto; padding:28px 18px 50px; }
    h1 { font-size:clamp(22px,5vw,30px); margin:0; letter-spacing:.02em; }
    h2 { margin:0 0 16px; font-size:20px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:24px; }
    button,input { font:inherit; border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
    input { min-width:0; width:100%; background:var(--card); color:var(--text); }
    button { cursor:pointer; background:var(--card); color:var(--text); }
    button:hover { border-color:var(--blue); }
    button:disabled { cursor:wait; opacity:.6; }
    :focus-visible { outline:3px solid var(--blue); outline-offset:3px; }
    [hidden] { display:none !important; }
    #login { max-width:430px; margin:80px auto; }
    #login label { display:block; margin-bottom:8px; font-weight:600; }
    #login button { margin-top:12px; width:100%; background:var(--blue); color:var(--bg); }
    #message { color:var(--muted); overflow-wrap:anywhere; }
    #message.error { color:var(--red); }
    .muted,.time { color:var(--muted); font-size:13px; }
    #connection { margin:0; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr)); gap:18px; }
    .card { background:var(--card); padding:20px; border:2px solid var(--gray); border-radius:16px; min-width:0; }
    .agent + .agent { border-top:1px solid var(--line); margin-top:20px; padding-top:20px; }
    .agent-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .agent-name { font-size:16px; font-weight:700; }
    .status { display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
    .dot { width:10px; height:10px; border-radius:50%; background:currentColor; flex-shrink:0; }
    .idle { color:var(--green); } .running { color:var(--blue); } .waiting { color:var(--yellow); }
    .error { color:var(--red); } .offline { color:var(--gray); }
    .running .dot { animation:pulse 1.7s ease-in-out infinite; }
    .waiting .dot { animation:blink 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow:0 0 0 5px color-mix(in srgb,currentColor 20%,transparent); transform:scale(1.1); } }
    @keyframes blink { 50% { opacity:.25; } }
    @media(prefers-reduced-motion:reduce) { .dot { animation:none !important; } }
    .detail { margin:8px 0 2px; overflow-wrap:anywhere; white-space:pre-wrap; }
    .limit { margin-top:12px; }
    .limit-label { display:flex; justify-content:space-between; gap:8px; font-size:13px; }
    .track { height:8px; border-radius:8px; overflow:hidden; background:var(--line); margin:5px 0; }
    .fill { height:100%; border-radius:8px; }
    .timeline { margin-top:30px; background:var(--card); padding:20px; border:1px solid var(--line); border-radius:16px; }
    #events { list-style:none; padding:0; margin:0; }
    #events li { padding:12px 0; border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
    #events li:last-child { border-bottom:0; }
    .event-top { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    #events p { margin:3px 0 0; }
    .empty { color:var(--muted); padding:12px 0; }
    @media(max-width:400px) { main { padding:20px 14px; } .card,.timeline { padding:16px; } }
  </style>
</head>
<body>
  <main>
    <header><div><h1>エージェント稼働状況</h1><p id="connection" class="muted" hidden>接続中…</p></div>
      <button id="logout" type="button" hidden>ログアウト</button></header>
    <form id="login" hidden>
      <label for="email">メールアドレス</label>
      <input id="email" type="email" autocomplete="email" placeholder="メールアドレス" required>
      <button type="submit">ログインリンクを送信</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="dashboard" hidden aria-label="稼働ダッシュボード">
      <div id="cards" class="cards"></div>
      <section class="timeline"><h2>直近の履歴</h2><ol id="events"></ol></section>
    </section>
  </main>
  <script>
    // 公開可能な project URL / anon key のみ。reporter_secret・service_role は置かない。
    const SUPABASE_URL = 'https://vuxcopiexcteuuznuhbr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ElL36IYZIV_l0NxTrZuQNw_nLSyDRFM';
    const OWNER_EMAIL = 'ultimate5040@gmail.com';
    const $ = id => document.getElementById(id);
    const stateNames = { idle:'待機中', running:'作業中', waiting:'承認待ち', error:'エラー', offline:'オフライン' };
    let client, channel, activeUser = null, generation = 0;
    let machines = [], statuses = [], events = [], refreshPending = false, refreshing = false;
    let dataReady = false;

    function message(text, error = false) {
      $('message').textContent = text;
      $('message').classList.toggle('error', error);
    }
    function element(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text != null) el.textContent = text;
      return el;
    }
    function relative(value) {
      if (!value || !Number.isFinite(Date.parse(value))) return '未受信';
      const seconds = Math.max(0, Math.floor((Date.now() - Date.parse(value)) / 1000));
      if (seconds < 60) return 'たった今';
      if (seconds < 3600) return `${Math.floor(seconds / 60)}分前`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)}時間前`;
      return `${Math.floor(seconds / 86400)}日前`;
    }
    function resetLabel(value) {
      if (!value || !Number.isFinite(Date.parse(value))) return 'リセット時刻：未取得';
      return `リセット：${new Date(value).toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })}`;
    }
    function stateBadge(state) {
      const safe = stateNames[state] ? state : 'offline';
      const badge = element('span', `status ${safe}`);
      const dot = element('span', 'dot');
      dot.setAttribute('aria-hidden', 'true');
      badge.append(dot, document.createTextNode(stateNames[safe]));
      return badge;
    }
    function limitBar(label, used, reset) {
      const box = element('div', 'limit');
      const known = used != null && Number.isFinite(Number(used));
      const left = known ? Math.max(0, Math.min(100, 100 - Number(used))) : null;
      const heading = element('div', 'limit-label');
      heading.append(element('span', '', label), element('span', '', known ? `残り ${Math.round(left)}%` : '未取得'));
      const track = element('div', 'track');
      track.setAttribute('role', 'progressbar');
      track.setAttribute('aria-label', `${label}の残り`);
      track.setAttribute('aria-valuemin', '0'); track.setAttribute('aria-valuemax', '100');
      if (known) track.setAttribute('aria-valuenow', String(left));
      else track.setAttribute('aria-valuetext', '未取得');
      const fill = element('div', 'fill');
      fill.style.width = `${left || 0}%`;
      fill.style.background = left >= 40 ? 'var(--green)' : left >= 15 ? 'var(--yellow)' : 'var(--red)';
      track.append(fill); box.append(heading, track, element('div', 'muted', resetLabel(reset)));
      return box;
    }
    function render() {
      if (!activeUser) return;
      const cards = document.createDocumentFragment();
      for (const machine of machines) {
        const card = element('article', 'card');
        if (/^#[0-9a-f]{6}$/i.test(machine.color || '')) card.style.borderColor = machine.color;
        card.append(element('h2', '', machine.label || machine.machine_id));
        for (const agent of ['claude', 'codex']) {
          const row = statuses.find(s => s.machine_id === machine.machine_id && s.agent === agent);
          const last = Date.parse(row?.last_seen);
          const stale = !Number.isFinite(last) || Date.now() - last >= 10 * 60 * 1000;
          const state = stale ? 'offline' : row.state;
          const section = element('div', 'agent');
          const heading = element('div', 'agent-heading');
          heading.append(element('span', 'agent-name', agent === 'claude' ? 'Claude' : 'Codex'), stateBadge(state));
          section.append(heading, element('p', 'detail', row?.detail || '報告なし'),
            element('div', 'time', `最終更新：${relative(row?.last_seen)}`));
          if (agent === 'claude') section.append(limitBar('5時間', row?.five_hour_used, row?.five_hour_resets_at),
            limitBar('週', row?.seven_day_used, row?.seven_day_resets_at));
          card.append(section);
        }
        cards.append(card);
      }
      if (!machines.length) cards.append(element('p', 'empty', dataReady ? '端末からの報告を待っています。' : '読み込み中…'));
      $('cards').replaceChildren(cards);
      const timeline = document.createDocumentFragment();
      for (const event of events.slice(0, 20)) {
        const item = element('li');
        const heading = element('div', 'event-top');
        const machine = machines.find(m => m.machine_id === event.machine_id);
        heading.append(element('strong', '', `${machine?.label || event.machine_id} / ${event.agent === 'claude' ? 'Claude' : 'Codex'}`),
          stateBadge(event.state), element('span', 'time', relative(event.created_at)));
        item.append(heading);
        if (event.detail) item.append(element('p', 'muted', event.detail));
        timeline.append(item);
      }
      if (!events.length) timeline.append(element('li', 'empty', dataReady ? '履歴はまだありません。' : '読み込み中…'));
      $('events').replaceChildren(timeline);
    }
    async function refresh() {
      if (!activeUser) return;
      if (refreshing) { refreshPending = true; return; }
      refreshing = true;
      const current = generation;
      try {
        do {
          refreshPending = false;
          const results = await Promise.all([
            client.from('machines').select('*').order('machine_id'),
            client.from('agent_status').select('*'),
            client.from('events').select('*').order('created_at', { ascending:false }).order('id', { ascending:false }).limit(20)
          ]);
          if (current !== generation || !activeUser) return;
          if (results.some(r => r.error)) throw new Error('read failed');
          [machines, statuses, events] = results.map(r => r.data || []);
          dataReady = true; message(''); render();
        } while (refreshPending && current === generation);
      } catch {
        if (current === generation && activeUser) message('データを取得できません。接続とアクセス権を確認してください。自動で再試行します。', true);
      } finally {
        refreshing = false;
        if (current !== generation && activeUser) void refresh();
      }
    }
    async function applySession(session) {
      if (session?.user?.email && session.user.email !== OWNER_EMAIL) {
        await client.auth.signOut(); message('このアカウントには閲覧権限がありません。', true); return;
      }
      const user = session?.user?.id || null;
      if (user === activeUser) return;
      generation++; activeUser = user;
      if (channel) { void client.removeChannel(channel); channel = null; }
      machines = []; statuses = []; events = []; dataReady = false;
      $('cards').replaceChildren(); $('events').replaceChildren();
      $('login').hidden = !!user; $('dashboard').hidden = !user;
      $('logout').hidden = !user; $('connection').hidden = !user;
      message('');
      if (!user) return;
      render();
      const current = generation;
      channel = client.channel(`agent-dashboard-${current}`)
        .on('postgres_changes', { event:'*', schema:'public', table:'agent_status' }, () => void refresh())
        .on('postgres_changes', { event:'*', schema:'public', table:'events' }, () => void refresh())
        .subscribe(status => {
          if (current !== generation) return;
          $('connection').textContent = status === 'SUBSCRIBED' ? 'ライブ更新中' : '再接続中 · 30秒ごとに確認';
          if (status === 'SUBSCRIBED') void refresh();
        });
      void refresh();
    }
    $('login').addEventListener('submit', async event => {
      event.preventDefault();
      if (!client) return;
      const email = $('email').value.trim();
      if (email.toLowerCase() !== OWNER_EMAIL) { message('閲覧を許可されたメールアドレスを入力してください。', true); return; }
      const button = $('login').querySelector('button'); button.disabled = true;
      try {
        const redirect = new URL(location.href); redirect.hash = ''; redirect.search = '';
        const { error } = await client.auth.signInWithOtp({ email, options:{ emailRedirectTo:redirect.href } });
        if (error) throw error;
        message('ログインリンクを送りました。この端末のブラウザで開いてください。');
      } catch { message('リンクを送信できません。メール設定と送信制限を確認してください。', true); }
      finally { button.disabled = false; }
    });
    $('logout').addEventListener('click', async () => {
      try {
        const { error } = await client.auth.signOut();
        if (error) throw error;
        await applySession(null);
      } catch { message('ログアウトできません。もう一度お試しください。', true); }
    });
    async function init() {
      $('login').hidden = false;
      if ([SUPABASE_URL, SUPABASE_ANON_KEY].some(v => v === 'REPLACE_ME')) {
        $('login').querySelector('button').disabled = true;
        message('Supabase の URL と anon key を設定してください。'); return;
      }
      try {
        client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        // Auth コールバック内で Supabase API を await しない（認証ロックを避ける）。
        client.auth.onAuthStateChange((_event, session) => {
          setTimeout(() => { void applySession(session).catch(() => message('認証状態を更新できません。', true)); }, 0);
        });
        const { data, error } = await client.auth.getSession();
        if (error) throw error;
        await applySession(data.session);
        setInterval(() => { render(); void refresh(); }, 30000);
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) { render(); void refresh(); }
        });
      } catch { message('接続できません。Supabase の設定とネットワークを確認してください。', true); }
    }
    void init();
  </script>
</body>
</html>
