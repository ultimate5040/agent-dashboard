<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>タスク処理</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root { --bg:#f3f6fa; --card:#fff; --text:#17253a; --muted:#56657a; --line:#dce3ec; --green:#16834c; --blue:#2563eb; --yellow:#a96900; --red:#d12d3e; --gray:#7b8797; }
    @media(prefers-color-scheme:dark) { :root { --bg:#101722; --card:#1a2433; --text:#edf2fa; --muted:#b1bfd2; --line:#354258; --green:#4cce8a; --blue:#70a9ff; --yellow:#f7c24e; --red:#ff7c88; --gray:#97a2b3; } }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 system-ui,sans-serif; }
    main { max-width:1100px; margin:auto; padding:22px 16px 85px; }
    h1 { margin:0; font-size:clamp(18px,4vw,25px); } h2 { margin:0; font-size:17px; }
    header,.header-actions { display:flex; align-items:center; gap:12px; } header { justify-content:space-between; margin-bottom:18px; }
    .header-actions { justify-content:flex-end; } #connection { margin:0; font-size:12px; } #connection:before { content:'● '; color:var(--gray); }
    #connection[data-state="connected"]:before { color:var(--green); } #connection[data-state="reconnecting"]:before { color:var(--yellow); } #connection[data-state="disconnected"]:before { color:var(--red); }
    .fetch-status { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px; } #fetch-status { margin:0; color:var(--muted); }
    button,input,textarea,select { font:inherit; border:1px solid var(--line); border-radius:8px; padding:7px 10px; background:var(--card); color:var(--text); }
    button,summary { cursor:pointer; } button:hover { border-color:var(--blue); } button:disabled { opacity:.6; }
    input,textarea { width:100%; min-width:0; } textarea { resize:vertical; min-height:72px; }
    :focus-visible { outline:3px solid var(--blue); outline-offset:3px; } [hidden] { display:none !important; }
    #login,#password-form { max-width:430px; margin:70px auto 12px; } #login label,#password-form label { display:block; margin:10px 0 6px; } #login input,#password-form input { width:100%; } #login button,#password-form button { margin-top:12px; width:100%; }
    .secondary { background:transparent; border:1px solid var(--line); color:var(--muted,inherit); }
    #config-message { max-width:430px; margin:auto; color:var(--muted); }
    #message,.muted,.time,.empty { color:var(--muted); font-size:12px; } #message.error,.error { color:var(--red); }
    .cards { display:grid; gap:12px; }
    .dot { width:8px; height:8px; border-radius:50%; background:currentColor; flex-shrink:0; }
    .character { display:block; width:64px; height:64px; margin:auto; overflow:visible; }
    .body { transform-origin:80px 115px; animation:breathe 4s ease-in-out infinite; }
    .eyes { transform-origin:80px 65px; animation:eyes 7s infinite; }
    .attention,.sweat,.cross,.sleep { display:none; }
    .running .body { animation:bounce .7s ease-in-out infinite; }
    .work-icon { height:23px; font-size:19px; line-height:23px; animation:float 3s ease-in-out infinite; }
    .waiting { color:var(--yellow); border-color:var(--yellow); animation:waiting-frame 1.2s infinite; }
    .waiting .attention { display:block; animation:blink 1.2s infinite; }
    .waiting .hands { transform:translateY(-28px) rotate(-12deg); transform-origin:80px 100px; }
    .error .cross,.error .sweat,.offline .sleep { display:block; } .error .eyes,.offline .eyes { display:none; }
    .offline .character { filter:grayscale(1); opacity:.65; } .offline .body { transform:translateY(35px) scaleY(.65); animation:none; }
    .continuation { display:flex; align-items:center; gap:6px; margin:6px 0; min-width:0; }
    #continue-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border:1px solid var(--pick,var(--line)); border-radius:12px; padding:2px 8px; }
    .crew { align-items:flex-start; } .task-continuation { font-size:10px; white-space:nowrap; color:var(--muted); }
    .overflow { align-self:center; font-size:12px; padding-left:4px; } .limits { min-width:0; }
    .limit { margin:7px 0; } .limit-label { display:flex; justify-content:space-between; gap:6px; flex-wrap:wrap; font-size:12px; }
    .limit > summary { list-style:none; font-weight:400; } .limit > summary::-webkit-details-marker { display:none; }
    .limit-hint { display:block; font-size:12px; color:var(--muted); white-space:normal; } .limit.stale { opacity:.65; }
    .limit-reset { margin:4px 0; font-size:12px; overflow-wrap:anywhere; } .machine-info { min-width:0; } .worker-state { margin:4px 0 0; font-size:12px; color:var(--muted); }
    .track { height:5px; border-radius:8px; overflow:hidden; background:var(--line); } .fill { height:100%; }
    .machine-waiting { animation:waiting-frame 1.2s infinite; }
    .waiting-mark { color:var(--yellow); animation:blink 1.2s infinite; }
    .timeline { margin-top:18px; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; }
    summary { font-weight:600; } #events { list-style:none; margin:0; padding:0; } #events li { padding:8px 0; border-bottom:1px solid var(--line); }
    .event-top,.status { display:flex; align-items:center; gap:8px; flex-wrap:wrap; } .status { display:inline-flex; font-size:12px; }
    .idle { color:var(--green); } .running { color:var(--blue); } .offline { color:var(--gray); } #events p { margin:2px 0; }
    .task { margin:8px 0; border:1px solid var(--line); border-radius:10px; background:var(--card); overflow:hidden; }
    .task > summary { display:flex; align-items:center; gap:8px; padding:9px 12px; font-weight:400; }
    .task-prompt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
    .task-meta { white-space:nowrap; font-size:11px; color:var(--muted); } .task-content { padding:0 12px 10px; }
    .task-content p { white-space:pre-wrap; overflow-wrap:anywhere; } pre { white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.7 ui-monospace,monospace; }
    .panel { margin-top:14px; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:14px; }
    .request-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; margin-bottom:4px; }
    .target-label { font-weight:700; color:var(--pick,var(--text)); }
    #prompt { width:100%; min-height:84px; }
    .request-foot { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin-top:6px; } .request-foot #send { margin-left:auto; }
    .advanced { margin-top:6px; } .advanced summary { font-weight:400; font-size:13px; color:var(--muted); }
    .settings,.permissions,.chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; } .settings label { flex:1; min-width:95px; } .settings select { display:block; width:100%; }
    fieldset { border:0; padding:0; margin-top:10px; } legend { font-size:12px; }
    .permissions label { position:relative; border:1px solid var(--line); border-radius:20px; padding:3px 9px; font-size:12px; cursor:pointer; }
    .permissions label:has(input:checked) { color:var(--blue); border-color:var(--blue); background:color-mix(in srgb,var(--blue) 10%,var(--card)); }
    .permissions label:focus-within { outline:2px solid var(--blue); } .permissions input { position:absolute; opacity:0; width:1px; height:1px; }
    .primary { background:var(--blue); color:var(--card); width:100%; }
    @keyframes breathe { 50% { transform:scale(1.025); } } @keyframes eyes { 0%,92%,96%,100% { transform:scaleY(1); } 94% { transform:scaleY(.1); } }
    @keyframes bounce { 50% { transform:translateY(-7px); } } @keyframes float { 50% { transform:translateY(-3px); } }
    @keyframes blink { 50% { opacity:.25; } } @keyframes waiting-frame { 0%,100% { border-color:var(--yellow); } 50% { border-color:var(--line); } }
    @keyframes pop { from { transform:scale(0); } to { transform:scale(1); } } @keyframes sheet { from { transform:translateY(20px); } to { transform:translateY(0); } }
    @media(max-width:600px) {
      main { padding:16px 8px 80px; } header { flex-wrap:wrap; gap:8px; } .header-actions { flex-wrap:wrap; gap:6px; }
      button,input,select,summary,.permissions label { min-height:44px; } button { min-width:44px; } .permissions label { display:inline-flex; align-items:center; }
      #connection,#message,.muted,.time,.empty,.agent-name,.bubble,.completed-bubble,.overflow,.limit-label,.limit-hint,.limit-reset,.worker-state,.status,.task-meta,.task-continuation,.advanced summary,legend,.permissions label,pre { font-size:14px; }
      .task > summary { flex-wrap:wrap; padding:8px; gap:5px; } .task-prompt { flex-basis:calc(100% - 80px); } .task-meta { white-space:normal; }
    }
    /* S1: one shared workplace. Furniture occupies .scene only; labels stay outside it. */
    :root { --bg:#f6f4ec; --text:#203b33; --card:#fffdf7; --line:#c8d2c7; --floor:#dce5d2; --tile:#bacbb04d; --wood:#c5a578; --wood-edge:#9f8159; --sofa:#8bac80; --wall:#aebf9f; }
    @media(prefers-color-scheme:dark) { :root { --bg:#17251f; --text:#e5eedc; --card:#26382d; --line:#485d4b; --floor:#30402e; --tile:#96af6c25; --wood:#8e7757; --wood-edge:#6b583f; --sofa:#607b53; --wall:#5a7052; } }
    :root { --request-bar-height:calc(44px + env(safe-area-inset-bottom,0px)); }
    main { max-width:900px; padding-top:14px; padding-bottom:var(--request-bar-height); }
    header { flex-wrap:nowrap; margin-bottom:10px; gap:8px; }
    header h1 { font-size:20px; white-space:nowrap; }
    .header-actions { flex-wrap:nowrap; gap:8px; }
    .account-menu { position:relative; }
    .account-menu > summary { list-style:none; padding:8px; min-width:44px; text-align:center; }
    .account-menu > summary::-webkit-details-marker { display:none; }
    .account-menu .menu-items { position:absolute; right:0; top:100%; z-index:30; width:180px; padding:8px; background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 4px 14px #0003; }
    .menu-items button { width:100%; margin:3px 0; }
    #message:empty,.fetch-status:has(#fetch-status:empty):has(#retry[hidden]) { display:none; }
    .tabs { display:flex; gap:8px; margin-bottom:10px; }
    .tabs button { flex:1; min-height:44px; }
    .tabs [aria-selected="true"] { background:var(--text); color:var(--card); font-weight:700; }
    .quotas { display:flex; align-items:center; justify-content:space-between; gap:4px; border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:6px; white-space:nowrap; }
    .quota-group { display:flex; align-items:center; gap:4px; min-width:0; font-size:12px; }
    .quota-group + .quota-group { border-left:1px solid var(--line); padding-left:4px; }
    .quotas .limit { position:relative; margin:0; }
    .quotas .limit > summary { display:flex; align-items:center; gap:3px; min-height:44px; font-size:12px; }
    .quotas .track { width:12px; height:8px; }
    .quotas .quota-value { font-variant-numeric:tabular-nums; }
    .quota-breakdown { position:absolute; top:100%; left:0; width:250px; max-width:calc(100vw - 32px); padding:10px; background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 4px 14px #0003; z-index:10; }
    .quota-group:last-child .quota-breakdown { left:auto; right:0; }
    .quota-breakdown p { margin:4px 0; font-size:12px; overflow-wrap:anywhere; }
    .office-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .office-heading h2 { font-size:15px; }
    .floor { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:8px; padding:12px 8px; background-color:var(--floor); background-image:linear-gradient(var(--tile) 1px,transparent 1px),linear-gradient(90deg,var(--tile) 1px,transparent 1px); background-size:24px 24px; box-shadow:inset 0 4px var(--wall); }
    .work-island,.lounge,.shelf,.reception { min-width:0; }
    .work-island { background:color-mix(in srgb,var(--floor) 65%,var(--card)); border-inline:2px solid var(--wall); padding:6px; }
    .zone-title { font-size:12px; color:var(--muted); margin:0 0 6px; }
    .work-seats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 4px; align-items:start; }
    .office-side { display:flex; flex-direction:column; gap:12px; min-width:0; }
    .rest-seats { display:grid; gap:10px; }
    .idle .sleep { display:block; }
    .idle .eyes { display:none; }
    .absence { grid-column:1/-1; font-size:12px; color:var(--muted); opacity:.65; margin:0; }
    .seat { min-width:0; text-align:center; color:var(--text); }
    .seat .bubble { display:block; position:static; transform:none; width:100%; max-width:100%; min-width:0; padding:4px; min-height:44px; margin:0; border-radius:8px; background:var(--card); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .scene { position:relative; height:108px; }
    .character-pick { position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:2; padding:0; border:0; background:transparent; width:76px; height:76px; }
    .seat .character { width:68px; height:68px; }
    .seat.picked { outline:none; background:transparent; }
    .seat.picked .character-pick { outline:2px solid var(--blue); border-radius:12px; }
    .seat .character-pick:focus-visible { outline:3px solid var(--blue); outline-offset:3px; border-radius:12px; }
    .scarf { stroke:var(--card); stroke-width:2; shape-rendering:crispEdges; }
    .sprite { display:block; pointer-events:none; }
    .sprite.sprite-image { background:none; border:0; box-shadow:none; }
    .sprite-image:before,.sprite-image:after { display:none; }
    .sprite-claude,.sprite-codex { position:relative; width:68px; height:68px; margin:auto; }
    .scarf-art { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
    .sprite-desk { position:absolute; top:56px; left:50%; transform:translateX(-50%); width:82px; height:30px; background:var(--wood); border-bottom:6px solid var(--wood-edge); border-radius:2px; z-index:3; box-shadow:3px 5px #0002; }
    .sprite-desk:before,.sprite-desk:after { content:''; position:absolute; width:4px; height:12px; background:var(--wood-edge); top:30px; }
    .sprite-desk:before { left:4px; } .sprite-desk:after { right:4px; }
    .monitor { position:absolute; left:30px; top:-15px; width:24px; height:19px; background:#244841; border:3px solid #d9f0d7; }
    .desk-keys { position:absolute; left:28px; top:13px; width:24px; height:6px; background:repeating-linear-gradient(90deg,var(--card) 0 3px,var(--wood-edge) 3px 4px); }
    .sprite-sofa { position:absolute; top:70px; left:50%; transform:translateX(-50%); width:82px; height:25px; background:var(--sofa); border:4px solid var(--wall); border-radius:6px; }
    .sprite-shelf { height:14px; background:var(--wood); border-bottom:5px solid var(--wood-edge); }
    .sprite-counter { height:22px; background:var(--wood); border-bottom:6px solid var(--wood-edge); }
    .sprite-plant { width:20px; height:26px; margin:6px auto; background:var(--wood-edge); border-top:18px solid var(--green); border-radius:12px 12px 3px 3px; }
    .seat .agent-state { display:block; width:fit-content; max-width:100%; margin:2px auto; padding:2px 5px; font-size:14px; font-weight:600; border-radius:5px; background:var(--card); }
    .elapsed { display:block; font-size:12px; color:var(--muted); }
    .seat.waiting { border:0; animation:none; }
    .shelf-ticket,.queue-ticket { min-width:0; }
    .shelf-ticket { background:var(--card); margin:4px 0; border:1px solid var(--line); }
    .shelf-ticket > summary { padding:6px 4px; font-size:14px; overflow-wrap:anywhere; }
    .shelf-ticket .task-content { padding:4px; }
    .shelf-ticket button { width:100%; padding:4px; font-size:14px; white-space:normal; }
    .shelf-ticket pre { font-size:14px; }
    .reception { grid-column:1/-1; border-top:1px solid var(--wall); padding-top:8px; }
    .queue { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
    .queue-ticket { flex:1 1 120px; background:var(--card); }
    .queue-ticket > summary { padding:6px; overflow-wrap:anywhere; font-size:14px; }
    .worker-summary { font-size:12px; color:var(--muted); margin:5px 0; overflow-wrap:anywhere; }
    .progress-panel { margin-top:6px; padding:8px; background:var(--card); border:1px solid var(--line); border-radius:8px; text-align:left; overflow-wrap:anywhere; }
    .progress-panel p,.progress-panel li { font-size:14px; white-space:pre-wrap; margin:4px 0; }
    .progress-panel ol { margin:0; padding-left:18px; }
    .request-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); z-index:21; width:100%; max-width:900px; height:var(--request-bar-height); border-radius:12px 12px 0 0; padding:0 8px env(safe-area-inset-bottom,0px); box-shadow:0 -2px 12px #0002; font-weight:600; }
    .panel { position:fixed; bottom:var(--request-bar-height); left:50%; transform:translateX(-50%); width:calc(100% - 16px); max-width:884px; margin:0; z-index:20; max-height:min(75dvh,calc(100dvh - var(--request-bar-height) - 20px)); overflow:auto; box-shadow:0 -2px 12px #0002; }
    .panel .request-head { font-size:12px; } #prompt { min-height:60px; }
    .request-foot #send { width:auto; }
    #management-panel { min-height:240px; padding:40px 16px; text-align:center; background:var(--card); }
    @media(max-width:600px) {
      .floor { gap:6px; padding:10px 4px; } .work-island { padding:4px 2px; }
      .quotas .limit-hint { font-size:11px; line-height:1.3; } .quota-breakdown p { font-size:14px; }
      .sprite-desk,.sprite-sofa { width:74px; } .monitor { left:25px; } .desk-keys { left:24px; }
      .panel { padding:8px; } .chips { margin:4px 0; } .chips button { padding:4px 7px; }
      .settings label { min-width:90px; }
    }
    @media(prefers-reduced-motion:reduce) { *, *:before, *:after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <main>
    <header><h1>タスク処理</h1><div class="header-actions"><p id="connection" class="muted" data-state="reconnecting" role="status" hidden>再接続中</p><details id="account-menu" class="account-menu" hidden><summary aria-label="メニュー">☰</summary><div class="menu-items"><button id="set-password" type="button" class="secondary" hidden>パスワード設定</button><button id="logout" type="button" hidden>ログアウト</button></div></details></div></header>
    <form id="login" hidden>
      <label for="email">メールアドレス</label>
      <input id="email" type="email" autocomplete="username" placeholder="メールアドレス" required>
      <label for="password">パスワード</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="パスワード">
      <button type="submit">ログイン</button>
      <button type="button" id="send-link" class="secondary">パスワード未設定・忘れた：ログインリンクをメールで送る</button>
    </form>
    <form id="password-form" hidden>
      <label for="new-password">新しいパスワード（8文字以上）</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
      <button type="submit">パスワードを設定</button>
      <button type="button" id="password-cancel" class="secondary">閉じる</button>
    </form>
    <p id="config-message" hidden></p>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="dashboard" hidden aria-label="稼働ダッシュボード">
      <div class="fetch-status"><p id="fetch-status" role="status" aria-live="polite"></p><button id="retry" type="button" hidden>再取得</button></div>
      <nav class="tabs" role="tablist" aria-label="画面切替">
        <button id="processing-tab" type="button" role="tab" aria-selected="true" aria-controls="processing-panel">タスク処理</button>
        <button id="management-tab" type="button" role="tab" aria-selected="false" aria-controls="management-panel" tabindex="-1">タスク管理</button>
      </nav>
      <section id="management-panel" role="tabpanel" aria-labelledby="management-tab" hidden><h2>準備中</h2></section>
      <section id="processing-panel" role="tabpanel" aria-labelledby="processing-tab">
      <div id="cards" class="cards"></div>
      <section aria-label="依頼一覧"><h2 style="margin-top:24px">依頼一覧</h2><div id="tasks"></div></section>
      <details class="timeline"><summary>直近のイベント</summary><ol id="events"></ol></details>
      <button id="request-toggle" class="request-bar" type="button" aria-expanded="false" aria-controls="panel" hidden>＋ 依頼を追加</button>
      <section id="panel" class="panel" hidden aria-label="キャラクターに指示する">
        <form id="request">
          <div class="request-head">
            <span id="target-label" class="target-label">宛先：どちらでも · Clawd</span>
            <span class="muted">キャラをタップすると宛先が変わります</span>
          </div>
          <div class="chips" aria-label="領域">
            <button type="button" data-domain="kyoka">教科</button><button type="button" data-domain="bunsho">分掌</button>
            <button type="button" data-domain="web-page">HP</button><button type="button" data-domain="web-app">アプリ</button>
          </div>
          <div id="continuation" class="continuation" hidden><span id="continue-label"></span><button id="continue-cancel" type="button" aria-label="続きモードを解除">✕</button></div>
          <textarea id="prompt" maxlength="8000" required aria-label="依頼内容" placeholder="お願いしたいことを入力…（生徒の個人情報は書かない）"></textarea>
          <div class="request-foot">
            <span id="count" class="muted">0 / 8000字</span>
            <span id="permission-summary" class="muted"></span>
            <button id="send" class="primary" type="submit">送信（Ctrl+Enter）</button>
          </div>
          <p id="send-message" role="status"></p>
          <details class="advanced">
            <summary>詳細設定（宛先・モデル・許可する操作）</summary>
            <div class="settings">
              <label>宛先<select id="target"><option value="any">どちらでも</option><option value="home">自宅PC</option><option value="school">勤務先PC</option></select></label>

        // Auth コールバック内で Supabase API を await しない（認証ロックを避ける）。
        client.auth.onAuthStateChange((_event, session) => {
          setTimeout(() => { void applySession(session).catch(() => message('認証状態を更新できません。', true)); }, 0);
        });
        const { data, error } = await client.auth.getSession();
        if (error) throw error;
        await applySession(data.session);
        setInterval(() => { render(); void refresh(); }, 30000);
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) { render(); void refresh(); }
        });
      } catch { message('接続できません。Supabase の設定とネットワークを確認してください。', true); }
    }
    void init();
  </script>
</body>
</html>
